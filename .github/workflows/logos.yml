name: Refresh organisation logos

# Monthly: looks for logos for organisations that have none, and re-checks automatic ones older
# than 30 days. Logos uploaded by editors and logos marked hidden are never changed.
on:
  schedule:
    - cron: "40 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logos:
    runs-on: ${{ vars.COLLECT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fetch-logos.ts
        env:
          DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          CRAWLER_USER_AGENT: ${{ vars.CRAWLER_USER_AGENT }}
